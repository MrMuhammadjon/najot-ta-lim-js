<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="scrit.js" defer></script>
    <title>Document</title>
  </head>
  <style>
    .parent {
      display: flex;
      gap: 25px;
      background-color: red;
      height: 300px;
    }

    [class*="item"] {
      width: 250px;
      height: 250px;
      border-radius: 18px;
      border: 2px solid black;
      background-color: lightgreen;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 50px;
      font-family: fantasy;
      margin: 15px;
    }

    .area {
      width: 900px;
      min-height: 600px;
      height: max-content;
      border-radius: 16px;
      border: 2px dotted black;
      background-color: dodgerblue;
      margin-top: 25px;
      padding: 20px;
      display: flex;
      gap: 25px;
    }
  </style>
  <body>
    <div class="parent">
      <div class="item" draggable="true">element 1</div>
      <div class="item" draggable="true">element 2</div>
      <div class="item" draggable="true">element 3</div>
    </div>

    <div class="area"></div>
  </body>
</html>
